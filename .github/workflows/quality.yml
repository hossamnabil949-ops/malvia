name: MALVIA Quality Gate

on:
  push:
    branches:
      - ai/response-speed-phase1
      - malvia-web
      - fix/financial-integrity-fin2-fin18
      - commercial-v1-fin18-next
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/quality.yml'
  pull_request:
    branches:
      - malvia-web
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malvia-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript and Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Financial and regression tests
        run: npm test
      - name: Production build
        run: npm run build
